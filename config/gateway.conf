# Addresses are numeric. Connection and queue limits apply to each worker.
listen 127.0.0.1 8080
workers 2
clients_per_worker 1024
header_bytes 16384
body_bytes 16777216
stream_buffer_bytes 65536
client_idle_ms 15000
header_timeout_ms 5000
connect_timeout_ms 1500
response_timeout_ms 10000
shutdown_timeout_ms 5000

# backend NAME IP PORT MAX_CONNECTIONS MAX_IDLE MAX_PENDING
backend local 127.0.0.1 9000 64 32 128

# route HOST PATH_PREFIX BACKEND
route * / local
