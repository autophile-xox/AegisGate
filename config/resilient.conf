# Run two simulator instances on the loopback data ports below.
listen 127.0.0.1 8080
workers 2
backend fast 127.0.0.1 9000 64 32 128
backend slow 127.0.0.1 9001 64 32 128
group api peak_ewma fast slow
route * / api

ewma_decay_ms 500
ewma_stale_ms 3000
ewma_initial_ms 10

circuit_breaker on
circuit_window 16
circuit_min_samples 4
circuit_failure_percent 50
circuit_cooldown_ms 1000
circuit_max_probes 1
circuit_recovery_successes 2

health_path /health
health_interval_ms 500
health_timeout_ms 250
health_failures 2
health_successes 2
