# Internal addresses on the Compose demo subnet.
listen 0.0.0.0 8080
metrics_listen 0.0.0.0 9091
workers 2

backend fast 172.29.45.11 9000 64 32 128
backend slow 172.29.45.12 9000 64 32 128
group demo peak_ewma fast slow
route * / demo
route * /limited demo
circuit_breaker on
circuit_window 10
circuit_min_samples 3
circuit_failure_percent 50
circuit_cooldown_ms 600
circuit_recovery_successes 2
health_interval_ms 250
health_timeout_ms 200

redis 172.29.45.10 6379
rate_namespace compose_demo
rate_wait_ms 35
rate_failure closed
quota global 5000 1800 64
quota tenant demo 1000 800 32
quota route * /limited 12 4 4
tenant_key demo AEGISGATE_DEMO_TENANT_KEY
