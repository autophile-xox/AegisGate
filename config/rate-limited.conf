# Redis and the Go simulator listen on loopback in the demo.
listen 127.0.0.1 8080
workers 2
backend origin 127.0.0.1 9000 64 32 128
route * /api origin

redis 127.0.0.1 6381
rate_namespace aegisgate_demo
rate_timeout_ms 100
rate_wait_ms 20
rate_lease_ms 1000
rate_queue 64
rate_failure closed

# Quota values are capacity, refill tokens per second, and lease batch size.
quota global 1000 250 32
quota tenant demo 100 50 8
quota route * /api 60 30 4
tenant_key demo AEGISGATE_DEMO_TENANT_KEY
