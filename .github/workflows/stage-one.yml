name: Stage 1 verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cpp:
    name: C++ ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            type: Debug
            flags: ""
          - name: Release
            type: Release
            flags: ""
          - name: ASan-UBSan
            type: Debug
            flags: -DAEGISGATE_SANITIZERS=ON
          - name: TSan
            type: Debug
            flags: -DAEGISGATE_TSAN=ON
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build redis-server redis-tools
      - name: Configure and compile
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ matrix.flags }}
          cmake --build build --parallel 3
      - name: Unit and integration tests
        if: matrix.name != 'TSan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
      - name: Thread sanitizer suite
        if: matrix.name == 'TSan'
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          # Reserve TSan's shadow address range on the disposable runner.
          if setarch "$(uname -m)" -R build/aegisgate_unit --gtest_list_tests >/dev/null 2>&1; then
            setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure
          else
            sudo sysctl -w vm.mmap_rnd_bits=28
            ctest --test-dir build --output-on-failure
          fi

  tools:
    name: Simulator and source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.4"
          cache: false
      - name: Format, analyze and test
        run: |
          python3 -m compileall -q benchmarks scripts tests/integration
          test -z "$(gofmt -l upstream-simulator)"
          cd upstream-simulator
          go vet ./...
          go test -race -v ./...

  deployment:
    name: Live Compose and dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set ephemeral demo identity
        run: echo "AEGISGATE_DEMO_TENANT_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Build and start the stack
        run: docker compose -p aegisgate-ci up -d --build --wait --wait-timeout 180
      - name: Verify both replicas, Prometheus and Grafana
        run: python3 scripts/verify-compose.py --project aegisgate-ci
      - name: Deployment diagnostics
        if: failure()
        run: |
          docker compose -p aegisgate-ci ps -a
          docker compose -p aegisgate-ci logs --tail=50
      - name: Stop the stack
        if: always()
        run: docker compose -p aegisgate-ci down
